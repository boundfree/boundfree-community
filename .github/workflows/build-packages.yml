name: Build packages (reusable)
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      release_build:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
    secrets:
      BF_CODE_SIGN_PFX_BASE64:
        required: false
      BF_CODE_SIGN_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/ci/requirements.txt
            sidecar/pyproject.toml
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libegl1 libopengl0 libgl1 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 libasound2t64 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          setup-python: false
          version: '6.8.2'
          modules: qtmultimedia qtshadertools
          cache: true
      - name: Install Python build and test dependencies
        shell: bash
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          python -m pip install --only-binary=:all: -r scripts/ci/requirements.txt "./sidecar[formats]"
          mkdir -p release/test-results
          python -m pip freeze > release/test-results/requirements-resolved.txt
      - name: Validate source version and release assets
        run: |
          python scripts/common/version_sync.py check
          python scripts/common/check_i18n.py
          python scripts/common/check_release_assets.py
      - name: Configure and compile (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DBF_REQUIRE_LICENSE=OFF
          cmake --build native/build --parallel 2
      - name: Configure and compile (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S native -B native/build-windows -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DBF_REQUIRE_LICENSE=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build native/build-windows --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Full regression tests (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest tests -x -v -ra --ignore=tests/scripts/test_verify_script.py --timeout=360 --junitxml=release/test-results/all.xml
      - name: Python and contract regression tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/scripts tests/sidecar tests/contracts tests/i18n tests/fixtures -x -v -ra --ignore=tests/scripts/test_verify_script.py --timeout=300 --junitxml=release/test-results/python.xml
      - name: Offline separation and export regressions (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/native/test_offline_eeg_separation.py tests/native/test_waveform_export_modes.py tests/native/test_continuous_playback.py -x -v -ra --timeout=300 --junitxml=release/test-results/native.xml
      - name: Stamp transient build identity
        shell: bash
        env:
          RELEASE_BUILD: ${{ inputs.release_build }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=()
          if [ "$RELEASE_BUILD" = true ]; then args+=(--release --tag "$RELEASE_TAG"); fi
          python scripts/ci/build_identity.py --number "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT" "${args[@]}"
      - name: Freeze sidecar (Linux)
        if: runner.os == 'Linux'
        working-directory: sidecar
        run: python -m PyInstaller --noconfirm --clean --distpath ../release/sidecar-dist --workpath ../release/sidecar-build boundfree_sidecar.spec
      - name: Compile licensed distribution (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S native -B native/build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DBF_REQUIRE_LICENSE=ON -DBF_LICENSE_PUBLIC_KEY_FILE="$PWD/license_public.pem"
          cmake --build native/build-release --target bf_app --parallel 2
      - name: Package and smoke test Linux archive
        if: runner.os == 'Linux'
        run: python scripts/ci/package_linux.py
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Build, install, smoke test and uninstall Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BF_CODE_SIGN_PFX_BASE64: ${{ secrets.BF_CODE_SIGN_PFX_BASE64 }}
          BF_CODE_SIGN_PASSWORD: ${{ secrets.BF_CODE_SIGN_PASSWORD }}
        run: ./scripts/ci/package_windows.ps1
      - name: Write provenance and checksums
        shell: bash
        run: |
          cp build-info.json dist/build-info-${{ runner.os }}.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(p for p in Path('dist').iterdir() if p.is_file())
          Path('dist/SHA256SUMS-${{ runner.os }}.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BoundFreeEEG-${{ runner.os }}-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test and acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ runner.os }}
          path: |
            release/test-results/
            release/windows-acceptance/
          if-no-files-found: warn
          retention-days: 30
