[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boundfree-sidecar"
version = "0.1.0.dev0"
description = "BoundFree EEG Python sidecar"
requires-python = ">=3.10"

[project.optional-dependencies]
formats = [
    "h5py==3.16.0",
    "mne==1.12.1",
    "pyedflib==0.1.42",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["boundfree_sidecar*"]
